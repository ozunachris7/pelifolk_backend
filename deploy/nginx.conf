worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Shared across nginx workers; key is overwritten by the sole public proxy.
    limit_req_zone $http_x_pelifolk_client zone=login:10m rate=5r/m;
    log_format safe '$time_iso8601 request_id=$request_id status=$status duration=$request_time upstream=$upstream_status';
    access_log /dev/stdout safe;
    error_log /dev/stderr crit;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        set $api http://api:8000;
        # API is private; replace forwarding headers before its trusted hop.
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $http_x_pelifolk_client;
        client_max_body_size 2m;
        add_header X-Request-ID $request_id always;
        location = /api/v1/auth/login {
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @login_limited;
            proxy_pass $api;
        }
        location @login_limited {
            default_type application/json;
            add_header Retry-After 12 always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
            return 429 '{"detail":"Too many login attempts. Try again later."}';
        }
        location /api/ {
            proxy_pass $api;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
        }
        location = /api/v1/profile/photo {
            client_max_body_size 6m;
            proxy_pass $api;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $request_id always;
        }
        location /upload/photos_profile/ {
            proxy_pass $api;
        }
        location = /health/ready { proxy_pass $api; }
        location = /health/live { proxy_pass $api; }
        location / {
            add_header Cache-Control no-cache always;
            add_header X-Request-ID $request_id always;
            try_files $uri $uri/ /index.html;
        }
    }
}
